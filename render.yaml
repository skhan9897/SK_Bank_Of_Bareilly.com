# ===============================================================
# SK BANK OF BAREILLY - RENDER DEPLOYMENT BLUEPRINT
# Render Infrastructure-as-Code Configuration
# ===============================================================

services:
  - type: web
    name: sk-bank-of-bareilly
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /
    envVars:
      - key: DB_URL
        value: jdbc:mysql://localhost:3306/sk_bank_of_bareilly?useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true
      - key: DB_USERNAME
        value: root
      - key: DB_PASSWORD
        value: root
