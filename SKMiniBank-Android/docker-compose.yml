version: '3.8'

services:
  # API Gateway (using Nginx)
  api-gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - transaction-service

  # Auth & User Service
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=auth
      - DB_URL=mongodb://mongo:27017/auth_db
    depends_on:
      - mongo

  # Transaction & Payment Service
  transaction-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=transaction
      - DB_URL=mongodb://mongo:27017/transaction_db
    depends_on:
      - mongo

  # Shared Database
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
